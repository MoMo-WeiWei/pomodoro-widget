<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion 療癒雙模式提醒小工具</title>
  <style>
    :root {
      --bg-page: #FAF8F5;
      --bg-card: #F3EFEA;
      --bg-input: #FFFFFF;
      --border-soft: #E5E0D8;
      --text-main: #4A4641;
      --text-sub: #8C857B;
      --accent-sage: #8FA893;
      --accent-sage-hover: #7A947E;
      --accent-terracotta: #D48C70;
      --accent-terracotta-hover: #C27A5E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .widget-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 12px rgba(74, 70, 65, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background-color: var(--bg-input);
      border: 1px solid var(--border-soft);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge:hover {
      background-color: #EFECE6;
      border-color: var(--accent-sage);
      color: var(--text-main);
    }

    .water-main-box {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      gap: 10px;
    }

    .water-timer-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .timer-big {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: var(--text-main);
      line-height: 1.1;
      margin: 4px 0 8px 0;
    }

    .water-btn-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mini-cat-corner {
      width: 128px;
      height: 104px;
      border-radius: 12px;
      background: linear-gradient(180deg, #FFFDF8 0%, #F9F0DF 75%, #EAE2D3 75%, #EAE2D3 100%);
      border: 1px solid var(--border-soft);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .mini-sun-rays {
      transform-origin: 26px 24px;
      animation: rotateSun 20s linear infinite;
    }
    .mini-cat-tail {
      transform-origin: 104px 76px;
      animation: catTailWag 3s ease-in-out infinite alternate;
    }
    .mini-cat-breath {
      transform-origin: 78px 78px;
      animation: catBreathing 2.8s ease-in-out infinite alternate;
    }
    @keyframes catBreathing {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(1.04); }
    }
    .mini-zzz {
      animation: floatZzz 3.2s ease-in-out infinite;
    }
    @keyframes floatZzz {
      0%, 100% { opacity: 0.2; transform: translate(0, 0); }
      50% { opacity: 0.85; transform: translate(3px, -4px); }
    }

    .water-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }

    input[type="number"], input[type="text"], input[type="time"], input[type="date"], select {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent-sage); }
    .input-mini { width: 58px; text-align: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-sage { background-color: var(--accent-sage); color: white; }
    .btn-sage:hover { background-color: var(--accent-sage-hover); }

    .btn-terracotta { background-color: var(--accent-terracotta); color: white; }
    .btn-terracotta:hover { background-color: var(--accent-terracotta-hover); }

    .btn-ghost {
      background-color: transparent;
      border: 1px solid var(--border-soft);
      color: var(--text-sub);
    }
    .btn-ghost:hover {
      background-color: var(--bg-page);
      color: var(--text-main);
    }

    .add-task-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-row { display: flex; gap: 8px; align-items: center; }
    .form-row input[type="text"] { flex: 1; }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-top { display: flex; justify-content: space-between; align-items: center; }
    .task-info { display: flex; flex-direction: column; gap: 4px; }
    .task-name {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .date-badge-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }

    .tag-routine {
      font-size: 11px;
      background: #EFECE6;
      color: #7A7267;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .tag-date {
      font-size: 11px;
      background: #F3EFEA;
      color: var(--text-main);
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
      border: 1px solid var(--border-soft);
    }

    .tag-weekday {
      font-size: 11px;
      background: #E6EEF4;
      color: #4A7A96;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .task-countdown {
      font-size: 12px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    .task-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .btn-icon {
      padding: 4px 8px;
      font-size: 12px;
      background: var(--bg-card);
      color: var(--text-sub);
      border-radius: 6px;
    }
    .btn-icon:hover { background: #E5DFD7; color: var(--text-main); }

    .subtask-section {
      border-top: 1px dashed var(--border-soft);
      padding-top: 6px;
      margin-top: 2px;
    }
    .subtask-toggle-header {
      font-size: 11.5px;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      padding: 2px 0;
    }
    .subtask-content {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      background: var(--bg-page);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }
    .subtask-section.expanded .subtask-content {
      display: flex;
    }

    .subtask-card {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .subtask-main-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subtask-main-row input[type="text"] {
      flex: 1;
      padding: 3px 6px;
      font-size: 12px;
      background: var(--bg-input);
    }
    .subtask-main-row input:checked + span {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .nested-children-box {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 2px solid var(--border-soft);
      padding-left: 8px;
    }
    .nested-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nested-row input[type="text"] {
      flex: 1;
      padding: 2px 5px;
      font-size: 11.5px;
      background: #FAF8F5;
    }
    .nested-row input:checked + span {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .routine-adjust, .edit-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-page);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-sub);
      border: 1px dashed var(--border-soft);
    }

    .edit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .future-section {
      margin-top: 12px;
      border-top: 1px dashed var(--border-soft);
      padding-top: 10px;
    }
    .future-toggle-header {
      font-size: 12.5px;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .future-list {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .future-section.expanded .future-list {
      display: flex;
    }

    .reflection-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 4px 12px rgba(74, 70, 65, 0.04);
    }

    .reflection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .reflection-content {
      display: none;
      margin-top: 12px;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    .reflection-card.expanded .reflection-content {
      display: flex;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .log-item {
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 0;
      border-bottom: 1px dashed #F3EFEA;
    }
    .log-item:last-child { border-bottom: none; }
    .log-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-time { color: var(--text-sub); font-size: 11.5px; }

    .log-subtask-preview {
      margin-left: 12px;
      font-size: 11.5px;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid var(--border-soft);
      padding-left: 6px;
    }

    .btn-copy {
      background: #EFECE6;
      color: var(--text-main);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      align-self: flex-end;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-copy:hover { background: #E5DFD7; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(250, 248, 245, 0.96);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    .overlay.active { display: flex; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .overlay-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .overlay-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
      min-height: 18px;
    }

    .alert-btn-row {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .alert-custom-box {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      background: var(--bg-card);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
    }

    .quote-box {
      font-size: 13.5px;
      font-weight: 500;
      color: #7A6E65;
      background: #F9F5EC;
      border: 1px dashed #D4C5B9;
      border-radius: 10px;
      padding: 8px 14px;
      margin-top: 6px;
      max-width: 290px;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.8s ease 0.4s;
    }
    .overlay.active .quote-box {
      opacity: 1;
      transform: translateY(0);
    }

    .garden-stage {
      width: 290px;
      height: 210px;
      background: linear-gradient(180deg, #FFFDF8 0%, #F7EFE0 76%, #E6DDD0 76%, #E6DDD0 100%);
      border: 2px solid var(--border-soft);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 6px;
      box-shadow: 0 10px 25px rgba(74, 70, 65, 0.08);
    }

    .sun-rays {
      transform-origin: 48px 44px;
      animation: rotateSun 22s linear infinite;
    }
    @keyframes rotateSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .stage-cat { transform-origin: 145px 145px; }
    .phase-knock .stage-cat { animation: catApproachScreen 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes catApproachScreen {
      0% { transform: translate(65px, 12px) scale(0.75); }
      50% { transform: translate(25px, 6px) scale(1.05) rotate(-3deg); }
      100% { transform: translate(0px, 4px) scale(1.32) rotate(0deg); }
    }

    .knock-paw { opacity: 0; transform-origin: 112px 158px; }
    .phase-knock .knock-paw { animation: pawKnockGlass 0.45s ease-in-out 1.4s infinite alternate; }
    @keyframes pawKnockGlass {
      0% { opacity: 1; transform: translate(0, 0) scale(0.95); }
      100% { opacity: 1; transform: translate(-4px, -6px) scale(1.12); }
    }

    .knock-ripple { opacity: 0; transform-origin: 102px 146px; }
    .phase-knock .knock-ripple { animation: glassRipple 0.9s ease-out 1.4s infinite; }
    @keyframes glassRipple {
      0% { opacity: 0.9; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    .phase-garden .stage-cat {
      transform: translate(62px, 14px) scale(0.88);
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cat-tail {
      transform-origin: 185px 152px;
      animation: catTailWag 2.6s ease-in-out infinite alternate;
    }
    @keyframes catTailWag {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(15deg); }
    }

    .flower-pot-group {
      opacity: 0;
      transform: translateY(25px) scale(0.8);
      transform-origin: 95px 165px;
      transition: opacity 1.2s ease, transform 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .phase-garden .flower-pot-group {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .water-drop { opacity: 0; transform: translateY(-25px); }
    .phase-watering .water-drop { animation: slowDropFall 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes slowDropFall {
      0% { opacity: 0; transform: translateY(-25px) scale(0.8); }
      30% { opacity: 1; transform: translateY(-5px) scale(1); }
      80% { opacity: 1; transform: translateY(25px) scale(1); }
      100% { opacity: 0; transform: translateY(35px) scale(0.7); }
    }

    .flower-bud { transform-origin: 95px 96px; transition: opacity 1s ease, transform 1s ease; }
    .phase-bloomed .flower-bud { opacity: 0; transform: scale(0.1); }

    .flower-head {
      transform-origin: 95px 88px;
      transform: scale(0.05) rotate(-45deg);
      opacity: 0;
      transition: transform 3s cubic-bezier(0.22, 1, 0.36, 1), opacity 2s ease;
    }
    .phase-bloomed .flower-head { transform: scale(1) rotate(0deg); opacity: 1; }

    .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .phase-bloomed .sparkle-1 { animation: blingTwinkle 2.2s ease-in-out 0.4s infinite; }
    .phase-bloomed .sparkle-2 { animation: blingTwinkle 2.2s ease-in-out 0.9s infinite; }
    .phase-bloomed .sparkle-3 { animation: blingTwinkle 2.2s ease-in-out 1.4s infinite; }
    @keyframes blingTwinkle {
      0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(15deg); }
    }

    .runner-stage {
      width: 240px;
      height: 140px;
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .runner-svg { animation: runBodyBounce 0.22s infinite alternate ease-in-out; }
    @keyframes runBodyBounce {
      0% { transform: translateY(1px) rotate(-4deg); }
      100% { transform: translateY(-6px) rotate(4deg); }
    }

    .cyclone-wheel {
      transform-origin: 52px 68px;
      animation: spinCyclone 0.18s linear infinite;
    }
    @keyframes spinCyclone {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    .speed-lines { position: absolute; width: 100%; height: 100%; pointer-events: none; }
    .speed-line {
      stroke: var(--text-sub);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.4;
      animation: dashMove 0.3s linear infinite;
    }
    @keyframes dashMove {
      0% { transform: translateX(70px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateX(-90px); opacity: 0; }
    }

    .runner-finished .runner-svg {
      animation: none;
      transform: translateY(0) scale(1.1);
      transition: transform 0.3s ease;
    }
    .runner-finished .cyclone-wheel { animation: none; opacity: 0.3; }

    .garden-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(250, 248, 245, 0.94);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      text-align: center;
    }
    .garden-modal-overlay.active { display: flex; animation: fadeIn 0.35s ease; }
    .garden-modal-card {
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 30px rgba(74, 70, 65, 0.1);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- 區塊一：固定喝水輪播 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">💧 喝水療癒提醒</div>
        <div class="badge" onclick="openGardenModal()" title="點擊查看今日花園圖鑑">
          🌸 今日開花：<span id="flowerCount">0</span> 朵 ▾
        </div>
      </div>

      <div class="water-main-box">
        <div class="water-timer-col">
          <div style="font-size: 12px; color: var(--text-sub);">距離下次喝水</div>
          <div class="timer-big" id="waterTimerDisplay">45:00</div>
          <div class="water-btn-row">
            <button class="btn-sage" id="waterToggleBtn" onclick="toggleWater()">啟動</button>
            <button class="btn-ghost" onclick="testWaterOverlay()">試看</button>
          </div>
        </div>

        <div class="mini-cat-corner" title="小橘貓正在曬太陽陪你倒數">
          <svg width="128" height="104" viewBox="0 0 128 104">
            <circle cx="26" cy="24" r="14" fill="#FFE699" opacity="0.5" />
            <circle cx="26" cy="24" r="9" fill="#F4C96B" />
            <g class="mini-sun-rays" stroke="#F4C96B" stroke-width="1.8" stroke-linecap="round">
              <line x1="26" y1="9" x2="26" y2="12" />
              <line x1="26" y1="36" x2="26" y2="39" />
              <line x1="11" y1="24" x2="14" y2="24" />
              <line x1="38" y1="24" x2="41" y2="24" />
              <line x1="15" y1="13" x2="18" y2="16" />

  <script>
    // ====== 雲端同步設定區（選填：填入 Firebase Realtime Database 網址即可跨裝置同步）======
    const CLOUD_SYNC_URL = "https://momo-cat-default-rtdb.asia-southeast1.firebasedatabase.app//momo_widget.json"; 

    const energyQuotes = [
      "🌸 ：喝口水，深呼吸，你已經做得比想像中還要好了。",
      "🔥 ：乾掉這杯水，宇宙的奧祕就由你來解開！",
      "🐱 ：本貓批准你休息三分鐘，趕快乖乖喝水！",
      "🤪 ：多喝水能讓腦子裡的裝水率下降，維持清醒（？）",
      "⚡ ：區區地心引力和疲勞，休想封印本大人的無敵覺醒之力！",
      "☕ ：世間萬物皆苦，但你的水是甜的（記得加糖或多喝兩口）。",
      "🚀 ：今日的偷懶是為了明日更好的躺平，先喝水再說！",
      "🐾 ：小橘貓用肉球跟你打勾勾，要記得照顧好自己喔～",
      "🤡 ：只要我喝水夠快，截止線就追不上我！",
      "🌌 ：沉睡的能量核心啊，藉由清澈的水流解開這道封印吧！"
    ];

    function getRandomQuote() {
      return energyQuotes[Math.floor(Math.random() * energyQuotes.length)];
    }

    let audioCtx = null;
    let chimeIntervalTimer = null;

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSingleChime(type = 'water') {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'water') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        }
      } catch (e) {
        console.log('音效等待互動解鎖');
      }
    }

    function playBlingBlingSound() {
      try {
        unlockAudio();
        const notes = [1046.50, 1318.51, 1567.98, 1975.53, 2349.32, 2637.02];
        notes.forEach((freq, idx) => {
          const startTime = audioCtx.currentTime + idx * 0.18;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(0.12, startTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + 0.9);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.95);
        });
      } catch (e) {
        console.log('Bling音效播放略過');
      }
    }

    function startContinuousChime(type) {
      stopContinuousChime();
      playSingleChime(type);
      chimeIntervalTimer = setInterval(() => {
        playSingleChime(type);
      }, 1500);
    }

    function stopContinuousChime() {
      if (chimeIntervalTimer) {
        clearInterval(chimeIntervalTimer);
        chimeIntervalTimer = null;
      }
    }

    function getTodayDateString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getChineseFormattedDate(dateStr) {
      const [yy, mo, dd] = dateStr.split('-');
      return `${yy}年${Number(mo)}月${Number(dd)}日`;
    }

    function getNextDateString(dateStr) {
      const [yy, mo, dd] = dateStr.split('-').map(Number);
      const d = new Date(yy, mo - 1, dd);
      d.setDate(d.getDate() + 1);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getWeekdayString(dateStr) {
      const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const d = new Date(dateStr);
      return weekdays[d.getDay()] || '';
    }

    const todayStr = getTodayDateString();
    document.getElementById('taskDateInput').value = todayStr;

    let state = JSON.parse(localStorage.getItem('notion_healing_widget_v19')) || {
      waterInterval: 45,
      flowerDate: todayStr,
      flowerCount: 0,
      logDate: todayStr,
      completedLogs: [],
      tasks: []
    };

    if (state.flowerDate !== todayStr || state.logDate !== todayStr) {
      state.flowerDate = todayStr;
      state.logDate = todayStr;
      state.flowerCount = 0;
      state.completedLogs = [];
    }

    function saveState() {
      localStorage.setItem('notion_healing_widget_v19', JSON.stringify(state));
      if (CLOUD_SYNC_URL) {
        fetch(CLOUD_SYNC_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        }).catch(() => {});
      }
    }

    async function pullCloudState() {
      if (!CLOUD_SYNC_URL) return;
      try {
        const res = await fetch(CLOUD_SYNC_URL);
        if (!res.ok) return;
        const remote = await res.json();
        if (remote && Array.isArray(remote.tasks)) {
          state = remote;
          localStorage.setItem('notion_healing_widget_v19', JSON.stringify(state));
          updateFlowerDisplay();
          renderTasks();
          renderReflectionLogs();
        }
      } catch (e) {}
    }

    function updateFlowerDisplay() {
      document.getElementById('flowerCount').textContent = state.flowerCount;
    }
    updateFlowerDisplay();

    function openGardenModal() {
      unlockAudio();
      const count = state.flowerCount;
      document.getElementById('gardenModalSub').textContent = `今日已收集 ${count} 朵花`;
      
      let encourageMsg = "";
      if (count === 0) {

    function computeTargetFromTask(task) {
      const target = new Date();
      if (task.mode === 'time') {
        const [hh, mm] = task.timeStr.split(':').map(Number);
        const [yy, mo, dd] = task.dateStr.split('-').map(Number);
        target.setFullYear(yy, mo - 1, dd);
        target.setHours(hh, mm, 0, 0);
      } else {
        target.setTime(Date.now() + task.minutes * 60000);
      }
      return target.getTime();
    }

      });
      if (t.status === 'running' && !t.targetTimestamp) {
        t.targetTimestamp = computeTargetFromTask(t);
      }

      } else {
        if (!alertQueue.some(q => q && q.id === item.id) && (!currentAlert || currentAlert.id !== item.id)) {
          alertQueue.push(item);

      processQueue();

      const logListEl = document.getElementById('logList');
      const logCountBadge = document.getElementById('logCountBadge');
      logListEl.innerHTML = '';
      logCountBadge.textContent = `${state.completedLogs.length} 項完成`;

      if (state.completedLogs.length === 0) {
        logListEl.innerHTML = `<div style="text-align: center; color: var(--text-sub); font-size: 12px; padding: 10px;">今天還沒有完成的任務喔！加油～</div>`;
        return;
      }

      state.completedLogs.forEach((log, logIdx) => {
        const item = document.createElement('div');
        item.className = 'log-item';

        let subtaskPreviewHtml = '';
        if (log.subtasks && log.subtasks.length > 0) {
          let innerHtml = '';
          log.subtasks.forEach(sub => {
            const checkIcon = sub.done ? '☑' : '☐';
            innerHtml += `<div>${checkIcon} ${sub.text}</div>`;
            if (sub.children && sub.children.length > 0) {
              sub.children.forEach(child => {
                const childCheck = child.done ? '☑' : '☐';
                innerHtml += `<div style="margin-left: 14px; color: var(--text-sub);">${childCheck} ${child.text}</div>`;
              });
            }
          });
          subtaskPreviewHtml = `
            <div style="margin-top: 2px;">
              <span style="font-size: 11px; color: var(--accent-sage); cursor: pointer; text-decoration: underline;" onclick="toggleLogSubtasks(${logIdx})">📄 檢視細項內容</span>
              <div id="log-subtask-box-${logIdx}" class="log-subtask-preview" style="display: none; margin-top: 4px;">
                ${innerHtml}
              </div>
            </div>
          `;
        }

        item.innerHTML = `
          <div class="log-item-header">
            <span>✅ ${log.name} <span class="tag-routine">${log.type}</span></span>
            <span class="log-time">${log.time} 完成</span>
          </div>
          ${subtaskPreviewHtml}
        `;
        logListEl.appendChild(item);
      });
    }

    function formatRemaining(ms) {
      if (ms <= 0) return '即將提醒...';
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) return `還有 ${h} 小時 ${m} 分 ${s} 秒`;
      return `還有 ${m} 分 ${s.toString().padStart(2, '0')} 秒`;
    }

    function buildEditPanelHtml(task) {
      if (editingTaskId !== task.id) return '';
      const timeControl = task.mode === 'time'
        ? `<input type="time" id="edit-time-${task.id}" value="${task.timeStr}" style="padding: 3px 6px; font-size: 12px;" />`
        : `<input type="number" id="edit-min-${task.id}" value="${task.minutes}" min="1" style="width: 55px; padding: 3px 6px; font-size: 12px;" /> 分鐘`;

      return `
        <div class="edit-panel">
          <div class="edit-row">
            <span>📅 改期：</span>
            <input type="date" id="edit-date-${task.id}" value="${task.dateStr}" style="padding: 3px 6px; font-size: 12px;" />
            ${timeControl}
          </div>
          <div class="edit-row" style="justify-content: flex-end;">
            <button class="btn-ghost" style="padding: 3px 8px; font-size: 11.5px;" onclick="toggleEditTask('${task.id}')">取消</button>
            <button class="btn-sage" style="padding: 3px 10px; font-size: 11.5px;" onclick="saveTaskEdit('${task.id}')">儲存變更</button>
          </div>
        </div>
      `;
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      const futureListEl = document.getElementById('futureList');
      listEl.innerHTML = '';
      futureListEl.innerHTML = '';

      const now = Date.now();
      const curDateStr = getTodayDateString();

      state.tasks.forEach(task => {
        if (task.type === 'routine' && task.dateStr < curDateStr && task.status === 'running') {
          task.dateStr = curDateStr;
          task.targetTimestamp = computeTargetFromTask(task);
          saveState();
        }
      });

      const sortedTasks = [...state.tasks].sort((a, b) => {
        const timeA = a.targetTimestamp || (computeTargetFromTask(a));
        const timeB = b.targetTimestamp || (computeTargetFromTask(b));
        return timeA - timeB;
      });

      let runningTodayCount = 0;
      let futureCount = 0;

      sortedTasks.forEach(task => {
        const isFuture = task.dateStr && task.dateStr > curDateStr;
        const editHtml = buildEditPanelHtml(task);
        const weekdayStr = getWeekdayString(task.dateStr);

        if (!task.subtasks) task.subtasks = [];
        let subtaskItemsHtml = '';
        task.subtasks.forEach((sub, sIdx) => {
          if (!sub.children) sub.children = [];
          
          let childrenHtml = '';
          sub.children.forEach((child, cIdx) => {
            childrenHtml += `
              <div class="nested-row">
                <input type="checkbox" ${child.done ? 'checked' : ''} onclick="toggleChildCheck('${task.id}', ${sIdx}, ${cIdx})" />
                <input type="text" value="${child.text}" oninput="updateChildText('${task.id}', ${sIdx}, ${cIdx}, this.value)" placeholder="輸入子條件或細節..." />
                <button class="btn-icon" style="padding: 1px 4px; font-size: 10px;" onclick="deleteChildSubtask('${task.id}', ${sIdx}, ${cIdx})">✕</button>
              </div>
            `;
          });

          subtaskItemsHtml += `
            <div class="subtask-card">
              <div class="subtask-main-row">
                <input type="checkbox" ${sub.done ? 'checked' : ''} onclick="toggleSubtaskCheck('${task.id}', ${sIdx})" />
                <input type="text" value="${sub.text}" oninput="updateSubtaskText('${task.id}', ${sIdx}, this.value)" placeholder="輸入大分類（例：A 餐廳）..." />
                <button class="btn-icon" style="padding: 2px 6px; font-size: 11px;" onclick="deleteSubtask('${task.id}', ${sIdx})">✕</button>
              </div>
              <div class="nested-children-box">
                ${childrenHtml}
                <button class="btn-ghost" style="padding: 2px 6px; font-size: 11px; align-self: flex-start;" onclick="addChildSubtask('${task.id}', ${sIdx})">+ 新增子細項/條件</button>
              </div>
            </div>
          `;
        });

        const subtaskSectionHtml = `
          <div class="subtask-section" id="subtask-sec-${task.id}">
            <div class="subtask-toggle-header" onclick="toggleSubtaskDrawer('${task.id}')">
              <span>📝 決策與細節清單 (${task.subtasks.length} 大項)</span>
              <span>▼ 展開 / 收合</span>
            </div>
            <div class="subtask-content">
              ${subtaskItemsHtml}
              <button class="btn-ghost" style="padding: 4px 10px; font-size: 12px; align-self: flex-start; margin-top: 2px;" onclick="addSubtask('${task.id}')">+ 新增主細項</button>
            </div>
          </div>
        `;

        if (isFuture) {
          futureCount++;
          const item = document.createElement('div');
          item.className = 'task-item';
          item.innerHTML = `
            <div class="task-top">
              <div class="task-info">
                <div class="task-name">${task.name}</div>
                <div class="date-badge-row">
                  <span class="tag-date">📅 ${task.dateStr}</span>
                  <span class="tag-weekday">${weekdayStr}</span>
                </div>
                <div class="task-countdown">預定時間：${task.mode === 'time' ? task.timeStr : task.minutes + '分鐘後'}</div>
              </div>
              <div class="task-actions">
                <button class="btn-icon" title="臨時改期/改時間" onclick="toggleEditTask('${task.id}')">✎</button>
                <button class="btn-icon" title="刪除" onclick="deleteTask('${task.id}')">✕</button>
              </div>
            </div>
            ${editHtml}
            ${subtaskSectionHtml}
          `;
          futureListEl.appendChild(item);
        } else {
          if (task.status === 'running') runningTodayCount++;

          const item = document.createElement('div');
          item.className = 'task-item';

          const typeBadge = task.type === 'routine'
            ? '<span class="tag-routine">🔁 例行</span>'
            : '<span class="tag-routine">⚡ 單次</span>';

          const scheduleDesc = task.mode === 'time'
            ? `目標 ${task.timeStr}`
            : `每 ${task.minutes} 分鐘`;

          let statusText = '';
          if (task.status === 'running') {
            statusText = `${scheduleDesc} ・ ${formatRemaining(task.targetTimestamp - now)}`;
          } else {
            statusText = `已完成本輪（可調整下方日期時間並重新啟動）`;
          }

          let adjustHtml = '';
          if (task.status === 'standby' && task.type === 'routine' && editingTaskId !== task.id) {
            const inputControl = task.mode === 'time'
              ? `<input type="time" id="adjust-time-${task.id}" value="${task.timeStr}" style="padding: 3px 6px; font-size: 12px;" />`
              : `<input type="number" id="adjust-min-${task.id}" value="${task.minutes}" min="1" style="width: 55px; padding: 3px 6px; font-size: 12px;" /> 分鐘`;

            adjustHtml = `
              <div class="routine-adjust">
                <div class="edit-row" style="width:100%;">
                  <span>下次：</span>
                  <input type="date" id="adjust-date-${task.id}" value="${curDateStr}" style="padding: 3px 6px; font-size: 12px;" />
                  ${inputControl}
                  <button class="btn-sage" style="padding: 4px 10px; font-size: 12px;" onclick="restartRoutineTask('${task.id}')">啟動</button>
                </div>
              </div>
            `;
          }

          item.innerHTML = `
            <div class="task-top">
              <div class="task-info">
                <div class="task-name">${task.name} ${typeBadge}</div>
                <div class="date-badge-row">
                  <span class="tag-date">📅 ${task.dateStr}</span>
                  <span class="tag-weekday">${weekdayStr}</span>
                </div>
                <div class="task-countdown" id="cd-${task.id}">${statusText}</div>
              </div>
              <div class="task-actions">
                <button class="btn-icon" title="臨時改期/改時間" onclick="toggleEditTask('${task.id}')">✎</button>
                <button class="btn-icon" title="試看狂奔提醒" onclick='testTaskOverlay(${JSON.stringify(task)})'>▶</button>
                <button class="btn-icon" title="刪除" onclick="deleteTask('${task.id}')">✕</button>
              </div>
            </div>
            ${editHtml}
            ${adjustHtml}
            ${subtaskSectionHtml}
          `;
          listEl.appendChild(item);
        }
      });

      document.getElementById('taskCountBadge').textContent = `${runningTodayCount} 個進行中`;
      document.getElementById('futureHeaderTitle').textContent = `🔮 未來預排任務 (${futureCount} 項)`;
      if (futureCount === 0) {
        futureListEl.innerHTML = `<div style="font-size: 11.5px; color: var(--text-sub); text-align: center; padding: 4px;">目前沒有預排任務</div>`;
      }
    }

    renderReflectionLogs();
    pullCloudState();

    setInterval(() => {
      if (waterRunning) {
        if (waterRemainingSec > 0) {
          waterRemainingSec--;
          updateWaterDisplay();
        } else {
          enqueueAlert('water');
          waterRemainingSec = state.waterInterval * 60;
        }
      }

      const now = Date.now();
      const curDateStr = getTodayDateString();

      state.tasks.forEach(task => {
        if (task.dateStr && task.dateStr === curDateStr && task.targetTimestamp === null) {
          task.targetTimestamp = computeTargetFromTask(task);
          saveState();
          renderTasks();
        }

        if (task.status === 'running' && task.dateStr === curDateStr) {
          const diff = task.targetTimestamp - now;
          const cdEl = document.getElementById(`cd-${task.id}`);
          if (cdEl) {
            const scheduleDesc = task.mode === 'time' ? `目標 ${task.timeStr}` : `每 ${task.minutes} 分鐘`;
            cdEl.textContent = `${scheduleDesc} ・ ${formatRemaining(diff)}`;
          }

          if (diff <= 0) {
            if (task.type === 'routine') {
              task.dateStr = getNextDateString(curDateStr);
              task.targetTimestamp = computeTargetFromTask(task);
              saveState();
              renderTasks();
            } else {
              enqueueAlert(task);
            }
          }
        }
      });
    }, 1000);

    setInterval(pullCloudState, 8000);

    renderTasks();
  </script>
</body>
</html>
