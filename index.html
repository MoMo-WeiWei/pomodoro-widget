<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion 療癒雙模式提醒小工具</title>
  <style>
    :root {
      --bg-page: #FAF8F5;
      --bg-card: #F3EFEA;
      --bg-input: #FFFFFF;
      --border-soft: #E5E0D8;
      --text-main: #4A4641;
      --text-sub: #8C857B;
      --accent-sage: #8FA893;
      --accent-sage-hover: #7A947E;
      --accent-terracotta: #D48C70;
      --accent-terracotta-hover: #C27A5E;
      --accent-warm: #E6C79C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .widget-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 12px rgba(74, 70, 65, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background-color: var(--bg-input);
      border: 1px solid var(--border-soft);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .water-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .timer-big {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    /* 休息區塊附帶常駐小貓預覽 */
    .water-preview-banner {
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-sub);
    }

    .water-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 10px;
    }

    input[type="number"], input[type="text"], input[type="time"], select {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-sage);
    }

    .input-mini {
      width: 60px;
      text-align: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-sage { background-color: var(--accent-sage); color: white; }
    .btn-sage:hover { background-color: var(--accent-sage-hover); }

    .btn-terracotta { background-color: var(--accent-terracotta); color: white; }
    .btn-terracotta:hover { background-color: var(--accent-terracotta-hover); }

    .btn-ghost {
      background-color: transparent;
      border: 1px solid var(--border-soft);
      color: var(--text-sub);
    }
    .btn-ghost:hover {
      background-color: var(--bg-input);
      color: var(--text-main);
    }

    .add-task-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .form-row input[type="text"] { flex: 1; }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .task-name {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-routine {
      font-size: 11px;
      background: #EFECE6;
      color: #7A7267;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .task-countdown {
      font-size: 12px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      padding: 4px 8px;
      font-size: 12px;
      background: var(--bg-card);
      color: var(--text-sub);
      border-radius: 6px;
    }
    .btn-icon:hover {
      background: #E5DFD7;
      color: var(--text-main);
    }

    .routine-adjust {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-page);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 互動遮罩 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(250, 248, 245, 0.96);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    .overlay.active {
      display: flex;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .overlay-sub {
      font-size: 13.5px;
      color: var(--text-sub);
      margin-bottom: 18px;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    /* ===== 貓咪敲螢幕與花園劇場舞台 ===== */
    .garden-stage {
      width: 280px;
      height: 210px;
      background: linear-gradient(180deg, #F7F3EC 0%, #EFE9DF 78%, #E5DDD0 78%, #E5DDD0 100%);
      border: 2px solid var(--border-soft);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(74, 70, 65, 0.06);
      transition: transform 0.25s ease;
    }
    .garden-stage:hover { transform: scale(1.02); }

    /* 太陽與光暈 */
    .sun-group {
      transform: translate(12px, -6px) scale(1);
      opacity: 1;
      transition: transform 2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sun-rays {
      transform-origin: 55px 48px;
      animation: rotateSun 18s linear infinite;
    }
    @keyframes rotateSun {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .sunbeam {
      opacity: 0.35;
    }

    /* 水滴動畫 */
    .water-drop {
      opacity: 0;
      transform: translateY(-22px);
    }
    .watering .water-drop {
      animation: slowDropFall 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes slowDropFall {
      0% { opacity: 0; transform: translateY(-22px) scale(0.8); }
      25% { opacity: 1; transform: translateY(-8px) scale(1); }
      80% { opacity: 1; transform: translateY(22px) scale(1); }
      100% { opacity: 0; transform: translateY(32px) scale(0.7); }
    }

    /* 朵朵開花動畫 */
    .flower-head {
      transform-origin: 105px 90px;
      transform: scale(0.1) rotate(-25deg);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease;
    }
    .bloomed .flower-head {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* Bling 閃爍 */
    .sparkle {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .bloomed .sparkle-1 { animation: blingTwinkle 1.6s ease-in-out 0.2s infinite; }
    .bloomed .sparkle-2 { animation: blingTwinkle 1.6s ease-in-out 0.6s infinite; }
    .bloomed .sparkle-3 { animation: blingTwinkle 1.6s ease-in-out 1.0s infinite; }

    @keyframes blingTwinkle {
      0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }

    /* 貓咪走路與敲螢幕動畫 */
    .interactive-cat {
      transform-origin: 205px 160px;
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 步驟一：貓咪從睡覺醒來、往前走並敲螢幕 */
    .cat-walking .interactive-cat {
      animation: catWalkForward 1.5s ease-in-out forwards;
    }
    @keyframes catWalkForward {
      0% { transform: translate(0, 0) scale(1); }
      60% { transform: translate(-70px, -20px) scale(1.35) rotate(-5deg); }
      100% { transform: translate(-65px, -18px) scale(1.4) rotate(0deg); }
    }

    .cat-paw-tap {
      opacity: 0;
    }
    .cat-walking .cat-paw-tap {
      animation: pawTapAnim 0.4s ease-in-out 1.2s infinite alternate;
    }
    @keyframes pawTapAnim {
      0% { opacity: 1; transform: translate(0, 0); }
      100% { opacity: 1; transform: translate(-6px, -4px) rotate(-10deg); }
    }

    /* 步驟二：貓咪開心地轉頭看花與太陽 */
    .cat-watching .interactive-cat {
      transform: translate(-45px, -10px) scale(1.25) rotate(6deg);
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cat-tail {
      transform-origin: 235px 158px;
      animation: catTailWag 2.8s ease-in-out infinite alternate;
    }
    @keyframes catTailWag {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(14deg); }
    }

    /* 旋風奔跑小人動畫 */
    .runner-stage {
      width: 240px;
      height: 140px;
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .runner-svg {
      animation: runBodyBounce 0.22s infinite alternate ease-in-out;
    }
    @keyframes runBodyBounce {
      0% { transform: translateY(1px) rotate(-4deg); }
      100% { transform: translateY(-6px) rotate(4deg); }
    }

    .cyclone-wheel {
      transform-origin: 52px 68px;
      animation: spinCyclone 0.18s linear infinite;
    }
    @keyframes spinCyclone {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    .speed-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .speed-line {
      stroke: var(--text-sub);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.4;
      animation: dashMove 0.3s linear infinite;
    }
    @keyframes dashMove {
      0% { transform: translateX(70px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateX(-90px); opacity: 0; }
    }

    .runner-finished .runner-svg {
      animation: none;
      transform: translateY(0) scale(1.1);
      transition: transform 0.3s ease;
    }
    .runner-finished .cyclone-wheel {
      animation: none;
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- 區塊一：固定喝水輪播 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">💧 喝水療癒輪播</div>
        <div class="badge">今日開花：<span id="flowerCount">0</span> 朵 🌸</div>
      </div>

      <div class="water-display">
        <div>
          <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 2px;">距離下次喝水</div>
          <div class="timer-big" id="waterTimerDisplay">45:00</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
          <button class="btn-sage" id="waterToggleBtn" onclick="toggleWater()">啟動輪播</button>
          <button class="btn-ghost" style="padding: 4px 10px; font-size: 11px;" onclick="testWaterOverlay()">試看澆花</button>
        </div>
      </div>

      <!-- 結合常駐小貓曬太陽的提示預覽列 -->
      <div class="water-preview-banner">
        <span>🐱 小橘貓正在旁邊慵懶曬太陽陪你倒數</span>
        <span style="font-size: 14px;">☀️</span>
      </div>

      <div class="water-controls">
        <span>每隔</span>
        <input type="number" id="waterIntervalInput" class="input-mini" value="45" min="1" max="240" onchange="updateWaterInterval()" />
        <span>分鐘自動提醒</span>
      </div>
    </div>

    <!-- 區塊二：彈性提醒任務清單 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🏃 彈性事項提醒</div>
        <div class="badge" id="taskCountBadge">0 個進行中</div>
      </div>

      <div class="add-task-box">
        <div class="form-row">
          <input type="text" id="taskNameInput" placeholder="輸入事項（例 : 訂午餐、收衣服）" />
        </div>
        <div class="form-row">
          <select id="taskModeSelect" onchange="toggleTimeInputMode()">
            <option value="time">指定時間 (幾點幾分)</option>
            <option value="interval">間隔倒數 (幾分鐘後)</option>
          </select>
          <input type="time" id="taskTimeInput" value="11:30" />
          <input type="number" id="taskMinutesInput" value="30" min="1" max="720" style="display: none; width: 75px;" />
          <span id="minuteLabel" style="display: none; font-size: 12px; color: var(--text-sub);">分鐘</span>
        </div>
        <div class="form-row" style="justify-content: space-between;">
          <select id="taskTypeSelect">
            <option value="routine">🔁 例行公事 (完成後保留，可調時間)</option>
            <option value="once">⚡ 一次性任務 (完成後自動消失)</option>
          </select>
          <button class="btn-terracotta" onclick="addTask()">+ 加入</button>
        </div>
      </div>

      <div class="task-list" id="taskList"></div>
    </div>
  </div>

  <!-- 互動遮罩 1：貓咪敲螢幕與花園劇場 -->
  <div class="overlay" id="waterOverlay">
    <div class="overlay-title" id="overlayTitle">🐱 貓貓來敲門囉！</div>
    <div class="overlay-sub" id="waterOverlaySub">點擊下方花園，和小貓一起賞花喝水吧</div>
    
    <div class="garden-stage" id="gardenStage" onclick="triggerWatering()">
      <svg width="280" height="210" viewBox="0 0 280 210">
        <defs>
          <linearGradient id="sunBeamGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFE699" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#FFE699" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- 暖陽斜射光束 -->
        <polygon class="sunbeam" points="45,35 120,25 265,175 110,185" fill="url(#sunBeamGrad)" />

        <!-- 溫暖的太陽 -->
        <g class="sun-group">
          <circle cx="55" cy="48" r="24" fill="#FFE699" opacity="0.45" />
          <circle cx="55" cy="48" r="16" fill="#F4C96B" />
          <g class="sun-rays" stroke="#F4C96B" stroke-width="2.5" stroke-linecap="round">
            <line x1="55" y1="22" x2="55" y2="27" />
            <line x1="55" y1="69" x2="55" y2="74" />
            <line x1="29" y1="48" x2="34" y2="48" />
            <line x1="76" y1="48" x2="81" y2="48" />
          </g>
        </g>

        <!-- 花盆 -->
        <polygon points="82,142 128,142 122,175 88,175" fill="#D48C70" />
        <rect x="78" y="135" width="54" height="8" rx="4" fill="#C27A5E" />

        <!-- 植物莖與葉 -->
        <path d="M105,135 Q103,112 105,90" stroke="#7A947E" stroke-width="4" fill="none" stroke-linecap="round" />
        <path d="M105,120 Q87,113 85,123 Q93,130 105,123" fill="#8FA893" />
        <path d="M105,110 Q123,103 125,113 Q117,120 105,113" fill="#8FA893" />

        <!-- 緩慢落下的水滴 -->
        <g class="water-drop">
          <path d="M105,46 Q112,58 105,62 Q98,58 105,46 Z" fill="#7FB3D5" />
          <circle cx="103" cy="55" r="1.5" fill="#FFFFFF" opacity="0.8" />
        </g>

        <!-- 盛開的大花朵 -->
        <g class="flower-head">
          <circle cx="105" cy="72" r="13" fill="#F4D3AB" />
          <circle cx="88" cy="84" r="13" fill="#F4D3AB" />
          <circle cx="122" cy="84" r="13" fill="#F4D3AB" />
          <circle cx="94" cy="101" r="13" fill="#F4D3AB" />
          <circle cx="116" cy="101" r="13" fill="#F4D3AB" />
          <circle cx="105" cy="88" r="10" fill="#E8A55A" />
        </g>

        <!-- Bling 閃亮星芒 -->
        <g fill="#F2B84B">
          <path class="sparkle sparkle-1" d="M74,66 L76,71 L81,73 L76,75 L74,80 L72,75 L67,73 L72,71 Z" />
          <path class="sparkle sparkle-2" d="M136,62 L138,67 L143,69 L138,71 L136,76 L134,71 L129,69 L134,67 Z" />
          <path class="sparkle sparkle-3" d="M105,46 L106.5,50 L110.5,51.5 L106.5,53 L105,57 L103.5,53 L99.5,51.5 L103.5,50 Z" />
        </g>

        <!-- 小貓咪主體（會往前走並敲螢幕） -->
        <g class="interactive-cat" id="interactiveCat">
          <path class="cat-tail" d="M235,163 Q252,155 248,142" fill="none" stroke="#E0A96D" stroke-width="5" stroke-linecap="round" />
          <ellipse cx="208" cy="162" rx="28" ry="14" fill="#E6B47B" />
          <path d="M202,149 Q204,154 206,149 M210,149 Q212,154 214,149" stroke="#C48B4E" stroke-width="2" fill="none" stroke-linecap="round" />
          
          <!-- 前腳與敲螢幕的手掌 -->
          <ellipse cx="176" cy="171" rx="10" ry="4.5" fill="#F2CFA5" />
          <g class="cat-paw-tap">
            <ellipse cx="168" cy="164" rx="6" ry="4" fill="#F2CFA5" />
          </g>

          <circle cx="184" cy="154" r="13" fill="#E6B47B" />
          <polygon points="173,146 175,135 182,143" fill="#E6B47B" />
          <polygon points="187,143 193,135 196,146" fill="#E6B47B" />
          <polygon points="175,145 176,138 180,143" fill="#F4C7B8" />
          <polygon points="189,143 192,138 194,145" fill="#F4C7B8" />

          <!-- 開心笑眼 -->
          <g stroke="#5C4938" stroke-width="1.6" fill="none" stroke-linecap="round">
            <path d="M177,154 Q180,151 182,154" />
            <path d="M186,154 Q189,151 191,154" />
          </g>
          <circle cx="176" cy="157" r="2.2" fill="#E89B8E" opacity="0.7" />
          <circle cx="192" cy="157" r="2.2" fill="#E89B8E" opacity="0.7" />
          <polygon points="183,156 185,156 184,158" fill="#D47A6A" />
        </g>
      </svg>
    </div>
  </div>

  <!-- 互動遮罩 2：旋風奔跑小人提醒 -->
  <div class="overlay" id="taskOverlay">
    <div class="overlay-title" id="taskOverlayTitle">⏰ 時間到了！</div>
    <div class="overlay-sub" id="taskOverlaySub">點擊下方奔跑小人，確認處理完成</div>

    <div class="runner-stage" id="runnerStage" onclick="completeTriggeredTask()">
      <svg class="speed-lines" viewBox="0 0 240 140">
        <line class="speed-line" x1="180" y1="35" x2="220" y2="35" />
        <line class="speed-line" x1="190" y1="70" x2="235" y2="70" style="animation-delay: 0.1s;" />
        <line class="speed-line" x1="175" y1="105" x2="215" y2="105" style="animation-delay: 0.2s;" />
      </svg>

      <svg class="runner-svg" width="110" height="110" viewBox="0 0 100 100">
        <path d="M74,20 Q74,26 71,26 Q68,26 68,20 Q71,14 74,20 Z" fill="#7FB3D5" />
        <circle cx="54" cy="22" r="10" fill="#4A4641" />
        <line x1="54" y1="32" x2="52" y2="60" stroke="#4A4641" stroke-width="5.5" stroke-linecap="round" />
        <polyline points="52,40 68,46 75,36" fill="none" stroke="#D48C70" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="52,40 36,48 30,38" fill="none" stroke="#4A4641" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <g class="cyclone-wheel">
          <ellipse cx="52" cy="74" rx="20" ry="10" fill="none" stroke="#8C857B" stroke-width="3" stroke-dasharray="6,4" />
          <ellipse cx="52" cy="74" rx="14" ry="6" fill="none" stroke="#D48C70" stroke-width="2.5" stroke-dasharray="4,3" />
          <path d="M36,74 Q52,60 68,74 Q52,88 36,74 Z" fill="#E5E0D8" opacity="0.6" />
        </g>
      </svg>
    </div>
  </div>

  <script>
    // ====== 音效系統 ======
    let audioCtx = null;
    let chimeIntervalTimer = null;

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSingleChime(type = 'water') {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'water') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        }
      } catch (e) {
        console.log('音效等待互動解鎖');
      }
    }

    function playBlingBlingSound() {
      try {
        unlockAudio();
        const notes = [1046.50, 1318.51, 1567.98, 1975.53, 2349.32, 2637.02];
        notes.forEach((freq, idx) => {
          const startTime = audioCtx.currentTime + idx * 0.16;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(0.14, startTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + 0.85);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.9);
        });
      } catch (e) {
        console.log('Bling音效播放略過');
      }
    }

    function startContinuousChime(type) {
      stopContinuousChime();
      playSingleChime(type);
      chimeIntervalTimer = setInterval(() => {
        playSingleChime(type);
      }, 1500);
    }

    function stopContinuousChime() {
      if (chimeIntervalTimer) {
        clearInterval(chimeIntervalTimer);
        chimeIntervalTimer = null;
      }
    }

    // ====== 資料與狀態管理 ======
    const TODAY_KEY = new Date().toDateString();
    let state = JSON.parse(localStorage.getItem('notion_healing_widget_v3')) || {
      waterInterval: 45,
      flowerDate: TODAY_KEY,
      flowerCount: 0,
      tasks: [
        {
          id: 'default-lunch',
          name: '訂午餐便當',
          mode: 'time',
          timeStr: '11:30',
          minutes: 30,
          type: 'routine',
          status: 'running',
          targetTimestamp: null
        }
      ]
    };

    if (state.flowerDate !== TODAY_KEY) {
      state.flowerDate = TODAY_KEY;
      state.flowerCount = 0;
    }

    function saveState() {
      localStorage.setItem('notion_healing_widget_v3', JSON.stringify(state));
    }

    function computeTargetFromTimeStr(timeStr) {
      const [hh, mm] = timeStr.split(':').map(Number);
      const target = new Date();
      target.setHours(hh, mm, 0, 0);
      if (target.getTime() <= Date.now()) {
        target.setDate(target.getDate() + 1);
      }
      return target.getTime();
    }

    state.tasks.forEach(t => {
      if (t.status === 'running' && !t.targetTimestamp) {
        t.targetTimestamp = t.mode === 'time'
          ? computeTargetFromTimeStr(t.timeStr)
          : Date.now() + t.minutes * 60000;
      }
    });
    saveState();

    // ====== 提醒佇列系統 ======
    let alertQueue = [];
    let currentAlert = null;

    function enqueueAlert(item) {
      if (item === 'water') {
        if (!alertQueue.includes('water') && currentAlert !== 'water') {
          alertQueue.push('water');
        }
      } else {
        if (!alertQueue.some(q => q && q.id === item.id) && (!currentAlert || currentAlert.id !== item.id)) {
          alertQueue.push(item);
        }
      }
      processQueue();
    }

    function processQueue() {
      if (currentAlert !== null) return;
      if (alertQueue.length === 0) return;

      currentAlert = alertQueue.shift();

      if (currentAlert === 'water') {
        showWaterOverlayModal();
      } else {
        showTaskOverlayModal(currentAlert);
      }
    }

    // ====== 喝水輪播與貓咪敲螢幕劇場 ======
    let waterRunning = false;
    let waterRemainingSec = state.waterInterval * 60;

    document.getElementById('waterIntervalInput').value = state.waterInterval;
    document.getElementById('flowerCount').textContent = state.flowerCount;
    updateWaterDisplay();

    function updateWaterDisplay() {
      const m = Math.floor(waterRemainingSec / 60).toString().padStart(2, '0');
      const s = (waterRemainingSec % 60).toString().padStart(2, '0');
      document.getElementById('waterTimerDisplay').textContent = `${m}:${s}`;
    }

    function toggleWater() {
      unlockAudio();
      waterRunning = !waterRunning;
      const btn = document.getElementById('waterToggleBtn');
      if (waterRunning) {
        btn.textContent = '暫停輪播';
        btn.classList.replace('btn-sage', 'btn-ghost');
      } else {
        btn.textContent = '繼續輪播';
        btn.classList.replace('btn-ghost', 'btn-sage');
      }
    }

    function updateWaterInterval() {
      const val = parseInt(document.getElementById('waterIntervalInput').value, 10);
      if (val && val > 0) {
        state.waterInterval = val;
        waterRemainingSec = val * 60;
        updateWaterDisplay();
        saveState();
      }
    }

    function testWaterOverlay() {
      unlockAudio();
      enqueueAlert('water');
    }

    function showWaterOverlayModal() {
      startContinuousChime('water');
      const stage = document.getElementById('gardenStage');
      const cat = document.getElementById('interactiveCat');
      
      stage.classList.remove('watering', 'bloomed');
      cat.className = 'interactive-cat cat-walking'; // 觸發貓咪往前走並敲螢幕
      
      document.getElementById('overlayTitle').textContent = '🐱 貓貓來敲門提醒囉！';
      document.getElementById('waterOverlaySub').textContent = '小貓：喂～該起來喝水休息囉！';
      document.getElementById('waterOverlay').classList.add('active');
    }

    let isWateringAnimating = false;
    function triggerWatering() {
      if (isWateringAnimating) return;
      isWateringAnimating = true;
      stopContinuousChime();

      const stage = document.getElementById('gardenStage');
      const cat = document.getElementById('interactiveCat');
      const subText = document.getElementById('waterOverlaySub');
      const titleText = document.getElementById('overlayTitle');

      // 階段 1：貓咪轉頭看太陽與花園
      cat.className = 'interactive-cat cat-watching';
      titleText.textContent = '🌸 小花園開花了！';
      subText.textContent = '💧 清水慢慢滋潤土壤，小貓開心地看著花朵～';
      stage.classList.add('watering');

      // 階段 2：花朵綻放 ＋ Bling 音效
      setTimeout(() => {
        stage.classList.add('bloomed');
        playBlingBlingSound();
        subText.textContent = '✨ 陽光暖暖的，花朵在陽光下盛開囉！';
        state.flowerCount += 1;
        document.getElementById('flowerCount').textContent = state.flowerCount;
        saveState();
      }, 2200);

      // 階段 3：收尾並關閉遮罩，回到倒數計時
      setTimeout(() => {
        document.getElementById('waterOverlay').classList.remove('active');
        waterRemainingSec = state.waterInterval * 60;
        updateWaterDisplay();
        isWateringAnimating = false;
        currentAlert = null;
        processQueue();
      }, 5200);
    }

    // ====== 彈性任務邏輯 ======
    function toggleTimeInputMode() {
      const mode = document.getElementById('taskModeSelect').value;
      if (mode === 'time') {
        document.getElementById('taskTimeInput').style.display = 'inline-block';
        document.getElementById('taskMinutesInput').style.display = 'none';
        document.getElementById('minuteLabel').style.display = 'none';
      } else {
        document.getElementById('taskTimeInput').style.display = 'none';
        document.getElementById('taskMinutesInput').style.display = 'inline-block';
        document.getElementById('minuteLabel').style.display = 'inline-block';
      }
    }

    function addTask() {
      unlockAudio();
      const name = document.getElementById('taskNameInput').value.trim();
      if (!name) return alert('請先輸入要提醒的事項名稱喔！');

      const mode = document.getElementById('taskModeSelect').value;
      const timeStr = document.getElementById('taskTimeInput').value || '12:00';
      const minutes = parseInt(document.getElementById('taskMinutesInput').value, 10) || 30;
      const type = document.getElementById('taskTypeSelect').value;

      const targetTimestamp = mode === 'time'
        ? computeTargetFromTimeStr(timeStr)
        : Date.now() + minutes * 60000;

      state.tasks.push({
        id: 'task-' + Date.now(),
        name,
        mode,
        timeStr,
        minutes,
        type,
        status: 'running',
        targetTimestamp
      });

      document.getElementById('taskNameInput').value = '';
      saveState();
      renderTasks();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
      renderTasks();
    }

    function restartRoutineTask(id) {
      unlockAudio();
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;

      if (task.mode === 'time') {
        const inputEl = document.getElementById(`adjust-time-${id}`);
        if (inputEl && inputEl.value) task.timeStr = inputEl.value;
        task.targetTimestamp = computeTargetFromTimeStr(task.timeStr);
      } else {
        const inputEl = document.getElementById(`adjust-min-${id}`);
        if (inputEl && inputEl.value) task.minutes = parseInt(inputEl.value, 10) || 30;
        task.targetTimestamp = Date.now() + task.minutes * 60000;
      }

      task.status = 'running';
      saveState();
      renderTasks();
    }

    function testTaskOverlay(task) {
      unlockAudio();
      enqueueAlert(task);
    }

    function showTaskOverlayModal(task) {
      startContinuousChime('task');
      document.getElementById('taskOverlayTitle').textContent = `⏰ ${task.name}`;
      document.getElementById('taskOverlaySub').textContent = '點擊下方奔跑小人，確認處理完成！';
      document.getElementById('runnerStage').classList.remove('runner-finished');
      document.getElementById('taskOverlay').classList.add('active');
    }

    function completeTriggeredTask() {
      if (!currentAlert || currentAlert === 'water') return;
      stopContinuousChime();

      const stage = document.getElementById('runnerStage');
      stage.classList.add('runner-finished');
      document.getElementById('taskOverlaySub').textContent = '✨ 使命必達！';

      const taskToComplete = currentAlert;
      const idx = state.tasks.findIndex(t => t.id === taskToComplete.id);
      if (idx !== -1) {
        const task = state.tasks[idx];
        if (task.type === 'once') {
          state.tasks.splice(idx, 1);
        } else {
          task.status = 'standby';
          task.targetTimestamp = null;
        }
        saveState();
      }

      setTimeout(() => {
        document.getElementById('taskOverlay').classList.remove('active');
        currentAlert = null;
        renderTasks();
        processQueue();
      }, 700);
    }

    function formatRemaining(ms) {
      if (ms <= 0) return '即將提醒...';
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) return `還有 ${h} 小時 ${m} 分 ${s} 秒`;
      return `還有 ${m} 分 ${s.toString().padStart(2, '0')} 秒`;
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';
      const now = Date.now();
      let runningCount = 0;

      state.tasks.forEach(task => {
        if (task.status === 'running') runningCount++;

        const item = document.createElement('div');
        item.className = 'task-item';

        const typeBadge = task.type === 'routine'
          ? '<span class="tag-routine">🔁 例行</span>'
          : '<span class="tag-routine">⚡ 單次</span>';

        const scheduleDesc = task.mode === 'time'
          ? `目標 ${task.timeStr}`
          : `每 ${task.minutes} 分鐘`;

        let statusText = '';
        if (task.status === 'running') {
          statusText = `${scheduleDesc} ・ ${formatRemaining(task.targetTimestamp - now)}`;
        } else {
          statusText = `已完成本輪（可調整下方時間並重新啟動）`;
        }

        let adjustHtml = '';
        if (task.status === 'standby' && task.type === 'routine') {
          const inputControl = task.mode === 'time'
            ? `<input type="time" id="adjust-time-${task.id}" value="${task.timeStr}" style="padding: 3px 6px; font-size: 12px;" />`
            : `<input type="number" id="adjust-min-${task.id}" value="${task.minutes}" min="1" style="width: 55px; padding: 3px 6px; font-size: 12px;" /> 分鐘`;

          adjustHtml = `
            <div class="routine-adjust">
              <div style="display:flex; align-items:center; gap:6px;">
                <span>下次時間：</span>
                ${inputControl}
              </div>
              <button class="btn-sage" style="padding: 4px 10px; font-size: 12px;" onclick="restartRoutineTask('${task.id}')">啟動下次</button>
            </div>
          `;
        }

        item.innerHTML = `
          <div class="task-top">
            <div class="task-info">
              <div class="task-name">${task.name} ${typeBadge}</div>
              <div class="task-countdown" id="cd-${task.id}">${statusText}</div>
            </div>
            <div class="task-actions">
              <button class="btn-icon" title="試看狂奔提醒" onclick='testTaskOverlay(${JSON.stringify(task)})'>▶</button>
              <button class="btn-icon" title="刪除" onclick="deleteTask('${task.id}')">✕</button>
            </div>
          </div>
          ${adjustHtml}
        `;
        listEl.appendChild(item);
      });

      document.getElementById('taskCountBadge').textContent = `${runningCount} 個進行中`;
    }

    // ====== 主計時器每秒巡檢 ======
    setInterval(() => {
      if (waterRunning) {
        if (waterRemainingSec > 0) {
          waterRemainingSec--;
          updateWaterDisplay();
        } else {
          enqueueAlert('water');
          waterRemainingSec = state.waterInterval * 60;
        }
      }

      const now = Date.now();
      state.tasks.forEach(task => {
        if (task.status === 'running') {
          const diff = task.targetTimestamp - now;
          const cdEl = document.getElementById(`cd-${task.id}`);
          if (cdEl) {
            const scheduleDesc = task.mode === 'time' ? `目標 ${task.timeStr}` : `每 ${task.minutes} 分鐘`;
            cdEl.textContent = `${scheduleDesc} ・ ${formatRemaining(diff)}`;
          }
          if (diff <= 0) {
            enqueueAlert(task);
          }
        }
      });
    }, 1000);

    renderTasks();
  </script>
</body>
