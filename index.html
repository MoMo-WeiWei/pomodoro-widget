<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion 療癒雙模式提醒小工具</title>
  <style>
    :root {
      --bg-page: #FAF8F5;
      --bg-card: #F3EFEA;
      --bg-input: #FFFFFF;
      --border-soft: #E5E0D8;
      --text-main: #4A4641;
      --text-sub: #8C857B;
      --accent-sage: #8FA893;
      --accent-sage-hover: #7A947E;
      --accent-terracotta: #D48C70;
      --accent-terracotta-hover: #C27A5E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .widget-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 12px rgba(74, 70, 65, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background-color: var(--bg-input);
      border: 1px solid var(--border-soft);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .water-main-box {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      gap: 10px;
    }

    .water-timer-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .timer-big {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: var(--text-main);
      line-height: 1.1;
      margin: 4px 0 8px 0;
    }

    .water-btn-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mini-cat-corner {
      width: 128px;
      height: 104px;
      border-radius: 12px;
      background: linear-gradient(180deg, #FFFDF8 0%, #F9F0DF 75%, #EAE2D3 75%, #EAE2D3 100%);
      border: 1px solid var(--border-soft);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .mini-sun-rays {
      transform-origin: 26px 24px;
      animation: rotateSun 20s linear infinite;
    }
    .mini-cat-tail {
      transform-origin: 104px 76px;
      animation: catTailWag 3s ease-in-out infinite alternate;
    }
    .mini-cat-breath {
      transform-origin: 78px 78px;
      animation: catBreathing 2.8s ease-in-out infinite alternate;
    }
    @keyframes catBreathing {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(1.04); }
    }
    .mini-zzz {
      animation: floatZzz 3.2s ease-in-out infinite;
    }
    @keyframes floatZzz {
      0%, 100% { opacity: 0.2; transform: translate(0, 0); }
      50% { opacity: 0.85; transform: translate(3px, -4px); }
    }

    .water-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }

    input[type="number"], input[type="text"], input[type="time"], select {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent-sage); }
    .input-mini { width: 58px; text-align: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-sage { background-color: var(--accent-sage); color: white; }
    .btn-sage:hover { background-color: var(--accent-sage-hover); }

    .btn-terracotta { background-color: var(--accent-terracotta); color: white; }
    .btn-terracotta:hover { background-color: var(--accent-terracotta-hover); }

    .btn-ghost {
      background-color: transparent;
      border: 1px solid var(--border-soft);
      color: var(--text-sub);
    }
    .btn-ghost:hover {
      background-color: var(--bg-page);
      color: var(--text-main);
    }

    .add-task-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-row { display: flex; gap: 8px; align-items: center; }
    .form-row input[type="text"] { flex: 1; }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-top { display: flex; justify-content: space-between; align-items: center; }
    .task-info { display: flex; flex-direction: column; gap: 2px; }
    .task-name {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-routine {
      font-size: 11px;
      background: #EFECE6;
      color: #7A7267;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .task-countdown {
      font-size: 12px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    .task-actions { display: flex; align-items: center; gap: 6px; }
    .btn-icon {
      padding: 4px 8px;
      font-size: 12px;
      background: var(--bg-card);
      color: var(--text-sub);
      border-radius: 6px;
    }
    .btn-icon:hover { background: #E5DFD7; color: var(--text-main); }

    .routine-adjust {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-page);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 互動遮罩 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(250, 248, 245, 0.96);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    .overlay.active { display: flex; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .overlay-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .overlay-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* 金句樣式盒子 */
    .quote-box {
      font-size: 13.5px;
      font-weight: 500;
      color: #7A6E65;
      background: #F9F5EC;
      border: 1px dashed #D4C5B9;
      border-radius: 10px;
      padding: 8px 14px;
      margin-top: 10px;
      max-width: 290px;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.8s ease 0.4s;
    }
    .overlay.active .quote-box {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== 劇場舞台：放慢節奏、精緻花朵與貓咪互動 ===== */
    .garden-stage {
      width: 290px;
      height: 210px;
      background: linear-gradient(180deg, #FFFDF8 0%, #F7EFE0 76%, #E6DDD0 76%, #E6DDD0 100%);
      border: 2px solid var(--border-soft);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: 0 10px 25px rgba(74, 70, 65, 0.08);
    }

    .sun-rays {
      transform-origin: 48px 44px;
      animation: rotateSun 22s linear infinite;
    }
    @keyframes rotateSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 階段一：小貓敲螢幕 */
    .stage-cat {
      transform-origin: 145px 145px;
    }

    .phase-knock .stage-cat {
      animation: catApproachScreen 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes catApproachScreen {
      0% { transform: translate(65px, 12px) scale(0.75); }
      50% { transform: translate(25px, 6px) scale(1.05) rotate(-3deg); }
      100% { transform: translate(0px, 4px) scale(1.32) rotate(0deg); }
    }

    .knock-paw {
      opacity: 0;
      transform-origin: 112px 158px;
    }
    .phase-knock .knock-paw {
      animation: pawKnockGlass 0.45s ease-in-out 1.4s infinite alternate;
    }
    @keyframes pawKnockGlass {
      0% { opacity: 1; transform: translate(0, 0) scale(0.95); }
      100% { opacity: 1; transform: translate(-4px, -6px) scale(1.12); }
    }

    .knock-ripple {
      opacity: 0;
      transform-origin: 102px 146px;
    }
    .phase-knock .knock-ripple {
      animation: glassRipple 0.9s ease-out 1.4s infinite;
    }
    @keyframes glassRipple {
      0% { opacity: 0.9; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    /* 階段二：小貓退回右側賞花 */
    .phase-garden .stage-cat {
      transform: translate(62px, 14px) scale(0.88);
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cat-tail {
      transform-origin: 185px 152px;
      animation: catTailWag 2.6s ease-in-out infinite alternate;
    }
    @keyframes catTailWag {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(15deg); }
    }

    /* 精緻花盆與植物：緩慢浮現 */
    .flower-pot-group {
      opacity: 0;
      transform: translateY(25px) scale(0.8);
      transform-origin: 95px 165px;
      transition: opacity 1.2s ease, transform 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .phase-garden .flower-pot-group {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 水滴：緩慢加長軌跡與時間 */
    .water-drop { opacity: 0; transform: translateY(-25px); }
    .phase-watering .water-drop {
      animation: slowDropFall 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes slowDropFall {
      0% { opacity: 0; transform: translateY(-25px) scale(0.8); }
      30% { opacity: 1; transform: translateY(-5px) scale(1); }
      80% { opacity: 1; transform: translateY(25px) scale(1); }
      100% { opacity: 0; transform: translateY(35px) scale(0.7); }
    }

    /* 花苞轉化 */
    .flower-bud {
      transform-origin: 95px 96px;
      transition: opacity 1s ease, transform 1s ease;
    }
    .phase-bloomed .flower-bud {
      opacity: 0;
      transform: scale(0.1);
    }

    /* 精緻化多層次開花動畫：拉長至 3 秒緩慢盛開 */
    .flower-head {
      transform-origin: 95px 88px;
      transform: scale(0.05) rotate(-45deg);
      opacity: 0;
      transition: transform 3s cubic-bezier(0.22, 1, 0.36, 1), opacity 2s ease;
    }
    .phase-bloomed .flower-head {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* Bling 閃亮星星：更柔和持久的呼吸閃爍 */
    .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .phase-bloomed .sparkle-1 { animation: blingTwinkle 2.2s ease-in-out 0.4s infinite; }
    .phase-bloomed .sparkle-2 { animation: blingTwinkle 2.2s ease-in-out 0.9s infinite; }
    .phase-bloomed .sparkle-3 { animation: blingTwinkle 2.2s ease-in-out 1.4s infinite; }
    @keyframes blingTwinkle {
      0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(15deg); }
    }

    /* 旋風奔跑小人動畫 */
    .runner-stage {
      width: 240px;
      height: 140px;
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .runner-svg { animation: runBodyBounce 0.22s infinite alternate ease-in-out; }
    @keyframes runBodyBounce {
      0% { transform: translateY(1px) rotate(-4deg); }
      100% { transform: translateY(-6px) rotate(4deg); }
    }

    .cyclone-wheel {
      transform-origin: 52px 68px;
      animation: spinCyclone 0.18s linear infinite;
    }
    @keyframes spinCyclone {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    .speed-lines { position: absolute; width: 100%; height: 100%; pointer-events: none; }
    .speed-line {
      stroke: var(--text-sub);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.4;
      animation: dashMove 0.3s linear infinite;
    }
    @keyframes dashMove {
      0% { transform: translateX(70px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateX(-90px); opacity: 0; }
    }

    .runner-finished .runner-svg {
      animation: none;
      transform: translateY(0) scale(1.1);
      transition: transform 0.3s ease;
    }
    .runner-finished .cyclone-wheel { animation: none; opacity: 0.3; }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- 區塊一：固定喝水輪播 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">💧 喝水療癒提醒</div>
        <div class="badge">今日開花：<span id="flowerCount">0</span> 朵 🌸</div>
      </div>

      <div class="water-main-box">
        <div class="water-timer-col">
          <div style="font-size: 12px; color: var(--text-sub);">距離下次喝水</div>
          <div class="timer-big" id="waterTimerDisplay">45:00</div>
          <div class="water-btn-row">
            <button class="btn-sage" id="waterToggleBtn" onclick="toggleWater()">啟動</button>
            <button class="btn-ghost" onclick="testWaterOverlay()">試看</button>
          </div>
        </div>

        <!-- 迷你曬太陽貓咪插畫 -->
        <div class="mini-cat-corner" title="小橘貓正在曬太陽陪你倒數">
          <svg width="128" height="104" viewBox="0 0 128 104">
            <circle cx="26" cy="24" r="14" fill="#FFE699" opacity="0.5" />
            <circle cx="26" cy="24" r="9" fill="#F4C96B" />
            <g class="mini-sun-rays" stroke="#F4C96B" stroke-width="1.8" stroke-linecap="round">
              <line x1="26" y1="9" x2="26" y2="12" />
              <line x1="26" y1="36" x2="26" y2="39" />
              <line x1="11" y1="24" x2="14" y2="24" />
              <line x1="38" y1="24" x2="41" y2="24" />
              <line x1="15" y1="13" x2="18" y2="16" />
              <line x1="34" y1="32" x2="37" y2="35" />
            </g>
            <path d="M16,78 Q18,70 21,78 M20,78 Q23,72 25,78" stroke="#8FA893" stroke-width="2" fill="none" stroke-linecap="round" />
            <g class="mini-cat-breath">
              <path class="mini-cat-tail" d="M104,76 Q118,70 115,59" fill="none" stroke="#E0A96D" stroke-width="4" stroke-linecap="round" />
              <ellipse cx="82" cy="76" rx="24" ry="12" fill="#E6B47B" />
              <path d="M77,64 Q79,69 81,64 M84,64 Q86,69 88,64" stroke="#C48B4E" stroke-width="1.8" fill="none" stroke-linecap="round" />
              <ellipse cx="54" cy="84" rx="8" ry="3.8" fill="#F2CFA5" />
              <ellipse cx="62" cy="86" rx="7.5" ry="3.5" fill="#E6B47B" />
              <circle cx="62" cy="69" r="11.5" fill="#E6B47B" />
              <polygon points="52,62 54,52 60,59" fill="#E6B47B" />
              <polygon points="65,59 70,52 73,62" fill="#E6B47B" />
              <polygon points="54,61 55,55 58,59" fill="#F4C7B8" />
              <polygon points="66,59 69,55 71,61" fill="#F4C7B8" />
              <path d="M55,69 Q58,71.5 60,69" stroke="#5C4938" stroke-width="1.5" fill="none" stroke-linecap="round" />
              <path d="M64,69 Q67,71.5 69,69" stroke="#5C4938" stroke-width="1.5" fill="none" stroke-linecap="round" />
              <circle cx="55" cy="72" r="2" fill="#E89B8E" opacity="0.7" />
              <circle cx="69" cy="72" r="2" fill="#E89B8E" opacity="0.7" />
              <polygon points="61,71 63,71 62,73" fill="#D47A6A" />
            </g>
            <text class="mini-zzz" x="76" y="48" font-size="10" font-weight="bold" fill="#8C857B">zZ</text>
          </svg>
        </div>
      </div>

      <div class="water-controls">
        <span>每隔</span>
        <input type="number" id="waterIntervalInput" class="input-mini" value="45" min="1" max="240" onchange="updateWaterInterval()" />
        <span>分鐘自動提醒</span>
      </div>
    </div>

    <!-- 區塊二：彈性提醒任務清單 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🏃 彈性事項提醒</div>
        <div class="badge" id="taskCountBadge">0 個進行中</div>
      </div>

      <div class="add-task-box">
        <div class="form-row">
          <input type="text" id="taskNameInput" placeholder="輸入事項（例：訂午餐、收衣服）" />
        </div>
        <div class="form-row">
          <select id="taskModeSelect" onchange="toggleTimeInputMode()">
            <option value="time">指定時間 (幾點幾分)</option>
            <option value="interval">間隔倒數 (幾分鐘後)</option>
          </select>
          <input type="time" id="taskTimeInput" value="11:30" />
          <input type="number" id="taskMinutesInput" value="30" min="1" max="720" style="display: none; width: 75px;" />
          <span id="minuteLabel" style="display: none; font-size: 12px; color: var(--text-sub);">分鐘</span>
        </div>
        <div class="form-row" style="justify-content: space-between;">
          <select id="taskTypeSelect">
            <option value="routine">🔁 例行公事 (完成後保留，可調時間)</option>
            <option value="once">⚡ 一次性任務 (完成後自動消失)</option>
          </select>
          <button class="btn-terracotta" onclick="addTask()">+</button>
        </div>
      </div>

      <div class="task-list" id="taskList"></div>
    </div>
  </div>

  <!-- 互動遮罩 1：貓咪走近敲螢幕 -> 緩慢開花與充能金句 -->
  <div class="overlay" id="waterOverlay">
    <div class="overlay-title" id="overlayTitle">🐱 叩、叩、叩！</div>
    <div class="overlay-sub" id="waterOverlaySub">小橘貓走過來敲敲螢幕叫你喝水囉！點一下畫面回應牠</div>
    
    <div class="garden-stage phase-knock" id="gardenStage" onclick="triggerWatering()">
      <svg width="290" height="210" viewBox="0 0 290 210">
        <!-- 溫暖的太陽 -->
        <circle cx="48" cy="42" r="24" fill="#FFE699" opacity="0.45" />
        <circle cx="48" cy="42" r="15" fill="#F4C96B" />
        <g class="sun-rays" stroke="#F4C96B" stroke-width="2.5" stroke-linecap="round">
          <line x1="48" y1="16" x2="48" y2="21" />
          <line x1="48" y1="63" x2="48" y2="68" />
          <line x1="22" y1="42" x2="27" y2="42" />
          <line x1="69" y1="42" x2="74" y2="42" />
        </g>

        <!-- 精緻化多層次植物與花盆群組 -->
        <g class="flower-pot-group">
          <!-- 花盆陰影與本體 -->
          <ellipse cx="95" cy="172" rx="26" ry="6" fill="#D5C5B5" opacity="0.6" />
          <polygon points="72,138 118,138 112,170 78,170" fill="#D48C70" />
          <rect x="68" y="131" width="54" height="8" rx="4" fill="#C27A5E" />
          <path d="M82,139 L86,169" stroke="#B87355" stroke-width="2" fill="none" opacity="0.4" />
          
          <!-- 優雅弧形莖與葉片 -->
          <path d="M95,131 Q91,105 95,82" stroke="#7A947E" stroke-width="4.5" fill="none" stroke-linecap="round" />
          <path d="M93,116 Q72,108 70,119 Q80,127 93,119" fill="#8FA893" />
          <path d="M95,104 Q118,97 120,108 Q110,116 95,108" fill="#8FA893" />

          <!-- 未開的小花苞 -->
          <g class="flower-bud">
            <path d="M89,86 Q95,70 101,86 Q95,90 89,96 Z" fill="#E6B88A" />
          </g>

    <div class="quote-box" id="quoteBox">🌟 休息是為了走更長的路，而你是為了喝爆珍奶而活！</div>

  <!-- 互動遮罩 2：旋風奔跑小人提醒 -->
  <div class="overlay" id="taskOverlay">
    <div class="overlay-title" id="taskOverlayTitle">⏰ 時間到了！</div>
    <div class="overlay-sub" id="taskOverlaySub">點擊下方奔跑小人，確認處理完成</div>

    <div class="runner-stage" id="runnerStage" onclick="completeTriggeredTask()">
      <svg class="speed-lines" viewBox="0 0 240 140">
        <line class="speed-line" x1="180" y1="35" x2="220" y2="35" />
        <line class="speed-line" x1="190" y1="70" x2="235" y2="70" style="animation-delay: 0.1s;" />

        <polyline points="52,40 36,48 30,38" fill="none" stroke="#4A4641" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <g class="cyclone-wheel">
          <ellipse cx="52" cy="74" rx="20" ry="10" fill="none" stroke="#8C857B" stroke-width="3" stroke-dasharray="6,4" />
          <ellipse cx="52" cy="74" rx="14" ry="6" fill="none" stroke="#D48C70" stroke-width="2.5" stroke-dasharray="4,3" />
          <path d="M36,74 Q52,60 68,74 Q52,88 36,74 Z" fill="#E5E0D8" opacity="0.6" />

    </div>
  </div>

  <script>
    // ====== 多元風格充能金句庫 (溫馨、勵志、可愛、搞笑、中二) ======
    const energyQuotes = [
      "🌸 喝口水，深呼吸，你已經做得比想像中還要好了。",
      "🔥 乾掉這杯水，宇宙的奧祕就由你來解開！",
      "🐱 本貓批准你休息三分鐘，趕快乖乖喝水！",
      "🤪 多喝水能讓腦子裡的裝水率下降，維持清醒（？）",
      "⚡ 區區地心引力和疲勞，休想封印本大人的無敵覺醒之力！",
      "☕ 世間萬物皆苦，但你的水是甜的（記得加糖或多喝兩口）。",
      "🚀 今日的偷懶是為了明日更好的躺平，先喝水再說！",
      "🐾 小橘貓用肉球跟你打勾勾，要記得照顧好自己喔～",
      "🤡 只要我喝水夠快，截止線就追不上我！",
      "🌌 沉睡的能量核心啊，藉由清澈的水流解開這道封印吧！"
    ];

    function getRandomQuote() {
      const randomIndex = Math.floor(Math.random() * energyQuotes.length);
      return energyQuotes[randomIndex];
    }

    // ====== 音效系統 ======
    let audioCtx = null;
    let chimeIntervalTimer = null;

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSingleChime(type = 'water') {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'water') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        }
      } catch (e) {
        console.log('音效等待互動解鎖');
      }
    }

    function playBlingBlingSound() {
      try {
        unlockAudio();
        const notes = [1046.50, 1318.51, 1567.98, 1975.53, 2349.32, 2637.02];
        notes.forEach((freq, idx) => {
          const startTime = audioCtx.currentTime + idx * 0.18;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(0.12, startTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + 0.9);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.95);
        });
      } catch (e) {
        console.log('Bling音效播放略過');
      }
    }

    function startContinuousChime(type) {
      stopContinuousChime();
      playSingleChime(type);
      chimeIntervalTimer = setInterval(() => {
        playSingleChime(type);
      }, 1500);
    }

    function stopContinuousChime() {
      if (chimeIntervalTimer) {
        clearInterval(chimeIntervalTimer);
        chimeIntervalTimer = null;
      }
    }

    // ====== 資料與狀態管理 ======
    const TODAY_KEY = new Date().toDateString();
    let state = JSON.parse(localStorage.getItem('notion_healing_widget_v6')) || {
      waterInterval: 45,
      flowerDate: TODAY_KEY,
      flowerCount: 0,
      tasks: [
        {
          id: 'default-lunch',
          name: '訂午餐便當',
          mode: 'time',
          timeStr: '11:30',
          minutes: 30,
          type: 'routine',
          status: 'running',
          targetTimestamp: null
        }
      ]
    };

    if (state.flowerDate !== TODAY_KEY) {
      state.flowerDate = TODAY_KEY;
      state.flowerCount = 0;
    }

    function saveState() {
      localStorage.setItem('notion_healing_widget_v6', JSON.stringify(state));
    }

    function computeTargetFromTimeStr(timeStr) {
      const [hh, mm] = timeStr.split(':').map(Number);
      const target = new Date();
      target.setHours(hh, mm, 0, 0);
      if (target.getTime() <= Date.now()) {
        target.setDate(target.getDate() + 1);
      }
      return target.getTime();
    }

    state.tasks.forEach(t => {
      if (t.status === 'running' && !t.targetTimestamp) {
        t.targetTimestamp = t.mode === 'time'
          ? computeTargetFromTimeStr(t.timeStr)
          : Date.now() + t.minutes * 60000;
      }
    });
    saveState();

    // ====== 提醒佇列系統 ======
    let alertQueue = [];
    let currentAlert = null;

    function enqueueAlert(item) {
      if (item === 'water') {
        if (!alertQueue.includes('water') && currentAlert !== 'water') {
          alertQueue.push('water');
        }
      } else {
        if (!alertQueue.some(q => q && q.id === item.id) && (!currentAlert || currentAlert.id !== item.id)) {
          alertQueue.push(item);
        }
      }
      processQueue();
    }

    function processQueue() {
      if (currentAlert !== null) return;
      if (alertQueue.length === 0) return;

      currentAlert = alertQueue.shift();

      if (currentAlert === 'water') {
        showWaterOverlayModal();
      } else {
        showTaskOverlayModal(currentAlert);
      }
    }

    // ====== 喝水輪播與慢節奏治癒劇場 ======
    let waterRunning = false;
    let waterRemainingSec = state.waterInterval * 60;

    document.getElementById('waterIntervalInput').value = state.waterInterval;
    document.getElementById('flowerCount').textContent = state.flowerCount;
    updateWaterDisplay();

    function updateWaterDisplay() {
      const m = Math.floor(waterRemainingSec / 60).toString().padStart(2, '0');
      const s = (waterRemainingSec % 60).toString().padStart(2, '0');
      document.getElementById('waterTimerDisplay').textContent = `${m}:${s}`;
    }

    function toggleWater() {
      unlockAudio();
      waterRunning = !waterRunning;
      const btn = document.getElementById('waterToggleBtn');
      if (waterRunning) {
        btn.textContent = '暫停';
        btn.classList.replace('btn-sage', 'btn-ghost');
      } else {
        btn.textContent = '繼續';
        btn.classList.replace('btn-ghost', 'btn-sage');
      }
    }

    function updateWaterInterval() {
      const val = parseInt(document.getElementById('waterIntervalInput').value, 10);
      if (val && val > 0) {
        state.waterInterval = val;
        waterRemainingSec = val * 60;
        updateWaterDisplay();
        saveState();
      }
    }

    function testWaterOverlay() {
      unlockAudio();
      enqueueAlert('water');
    }

    // 階段 1：貓咪敲螢幕，並隨機產生一則充能金句
    function showWaterOverlayModal() {
      startContinuousChime('water');
      const stage = document.getElementById('gardenStage');
      stage.className = 'garden-stage phase-knock';
      
      document.getElementById('overlayTitle').textContent = '🐱 叩、叩、叩！';
      document.getElementById('waterOverlaySub').textContent = '小橘貓走過來敲敲螢幕叫你喝水囉！點一下畫面回應牠';
      document.getElementById('quoteBox').textContent = getRandomQuote(); // 每次隨機換金句
      document.getElementById('waterOverlay').classList.add('active');
    }

    let isWateringAnimating = false;
    function triggerWatering() {
      if (isWateringAnimating) return;
      isWateringAnimating = true;
      stopContinuousChime();

      const stage = document.getElementById('gardenStage');
      const subText = document.getElementById('waterOverlaySub');
      const titleText = document.getElementById('overlayTitle');

      // 階段 2 (0.0s)：小貓退開，精緻花盆浮現
      stage.className = 'garden-stage phase-garden';
      titleText.textContent = '🌱 小花盆冒出來了！';
      subText.textContent = '小貓在溫暖陽光下期待著...';

      // 階段 3 (1.4s)：水滴緩慢落下
      setTimeout(() => {
        stage.classList.add('phase-watering');
        subText.textContent = '💧 清水緩緩滋潤土壤，給自己充個電吧～';
      }, 1400);

      // 階段 4 (3.2s)：精緻花朵緩慢綻放 ＋ 悠揚 Bling 音效
      setTimeout(() => {
        stage.classList.add('phase-bloomed');
        playBlingBlingSound();
        titleText.textContent = '🌸✨ 美麗綻放！';
        subText.textContent = '花朵在陽光下盛開，小橘貓開心地搖著尾巴！';
        state.flowerCount += 1;
        document.getElementById('flowerCount').textContent = state.flowerCount;
        saveState();
      }, 3200);

      // 階段 5 (8.0s)：拉長停留時間讓使用者細細欣賞，再返回主畫面
      setTimeout(() => {
        document.getElementById('waterOverlay').classList.remove('active');
        waterRemainingSec = state.waterInterval * 60;
        updateWaterDisplay();
        isWateringAnimating = false;
        currentAlert = null;
        processQueue();
      }, 8000);
    }

    // ====== 彈性任務邏輯 ======
    function toggleTimeInputMode() {
      const mode = document.getElementById('taskModeSelect').value;
      if (mode === 'time') {
        document.getElementById('taskTimeInput').style.display = 'inline-block';
        document.getElementById('taskMinutesInput').style.display = 'none';
        document.getElementById('minuteLabel').style.display = 'none';
      } else {
        document.getElementById('taskTimeInput').style.display = 'none';
        document.getElementById('taskMinutesInput').style.display = 'inline-block';
        document.getElementById('minuteLabel').style.display = 'inline-block';
      }
    }

    function addTask() {
      unlockAudio();
      const name = document.getElementById('taskNameInput').value.trim();
      if (!name) return alert('請先輸入要提醒的事項名稱喔！');

      const mode = document.getElementById('taskModeSelect').value;
      const timeStr = document.getElementById('taskTimeInput').value || '12:00';
      const minutes = parseInt(document.getElementById('taskMinutesInput').value, 10) || 30;
      const type = document.getElementById('taskTypeSelect').value;

      const targetTimestamp = mode === 'time'
        ? computeTargetFromTimeStr(timeStr)
        : Date.now() + minutes * 60000;

      state.tasks.push({
        id: 'task-' + Date.now(),
        name,
        mode,
        timeStr,
        minutes,
        type,
        status: 'running',
        targetTimestamp
      });

      document.getElementById('taskNameInput').value = '';
      saveState();
      renderTasks();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
      renderTasks();
    }

    function restartRoutineTask(id) {
      unlockAudio();
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;

      if (task.mode === 'time') {
        const inputEl = document.getElementById(`adjust-time-${id}`);
        if (inputEl && inputEl.value) task.timeStr = inputEl.value;
        task.targetTimestamp = computeTargetFromTimeStr(task.timeStr);
      } else {
        const inputEl = document.getElementById(`adjust-min-${id}`);
        if (inputEl && inputEl.value) task.minutes = parseInt(inputEl.value, 10) || 30;
        task.targetTimestamp = Date.now() + task.minutes * 60000;
      }

      task.status = 'running';
      saveState();
      renderTasks();
    }

    function testTaskOverlay(task) {
      unlockAudio();
      enqueueAlert(task);
    }

    function showTaskOverlayModal(task) {
      startContinuousChime('task');
      document.getElementById('taskOverlayTitle').textContent = `⏰ ${task.name}`;
      document.getElementById('taskOverlaySub').textContent = '點擊下方奔跑小人，確認處理完成！';
      document.getElementById('runnerStage').classList.remove('runner-finished');
      document.getElementById('taskOverlay').classList.add('active');
    }

    function completeTriggeredTask() {
      if (!currentAlert || currentAlert === 'water') return;
      stopContinuousChime();

      const stage = document.getElementById('runnerStage');
      stage.classList.add('runner-finished');
      document.getElementById('taskOverlaySub').textContent = '✨ 使命必達！';

      const taskToComplete = currentAlert;
      const idx = state.tasks.findIndex(t => t.id === taskToComplete.id);
      if (idx !== -1) {
        const task = state.tasks[idx];
        if (task.type === 'once') {
          state.tasks.splice(idx, 1);
        } else {
          task.status = 'standby';
          task.targetTimestamp = null;
        }
        saveState();
      }

      setTimeout(() => {
        document.getElementById('taskOverlay').classList.remove('active');
        currentAlert = null;
        renderTasks();
        processQueue();
      }, 700);
    }

    function formatRemaining(ms) {
      if (ms <= 0) return '即將提醒...';
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) return `還有 ${h} 小時 ${m} 分 ${s} 秒`;
      return `還有 ${m} 分 ${s.toString().padStart(2, '0')} 秒`;
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';
      const now = Date.now();
      let runningCount = 0;

      state.tasks.forEach(task => {
        if (task.status === 'running') runningCount++;

        const item = document.createElement('div');
        item.className = 'task-item';

        const typeBadge = task.type === 'routine'
          ? '<span class="tag-routine">🔁 例行</span>'
          : '<span class="tag-routine">⚡ 單次</span>';

        const scheduleDesc = task.mode === 'time'
          ? `目標 ${task.timeStr}`
          : `每 ${task.minutes} 分鐘`;

        let statusText = '';
        if (task.status === 'running') {
          statusText = `${scheduleDesc} ・ ${formatRemaining(task.targetTimestamp - now)}`;
        } else {
          statusText = `已完成本輪（可調整下方時間並重新啟動）`;
        }

        let adjustHtml = '';
        if (task.status === 'standby' && task.type === 'routine') {
          const inputControl = task.mode === 'time'
            ? `<input type="time" id="adjust-time-${task.id}" value="${task.timeStr}" style="padding: 3px 6px; font-size: 12px;" />`
            : `<input type="number" id="adjust-min-${task.id}" value="${task.minutes}" min="1" style="width: 55px; padding: 3px 6px; font-size: 12px;" /> 分鐘`;

          adjustHtml = `
            <div class="routine-adjust">
              <div style="display:flex; align-items:center; gap:6px;">
                <span>下次時間：</span>
                ${inputControl}
              </div>
              <button class="btn-sage" style="padding: 4px 10px; font-size: 12px;" onclick="restartRoutineTask('${task.id}')">啟動下次</button>
            </div>
          `;
        }

        item.innerHTML = `
          <div class="task-top">
            <div class="task-info">
              <div class="task-name">${task.name} ${typeBadge}</div>
              <div class="task-countdown" id="cd-${task.id}">${statusText}</div>
            </div>
            <div class="task-actions">
              <button class="btn-icon" title="試看狂奔提醒" onclick='testTaskOverlay(${JSON.stringify(task)})'>▶</button>
              <button class="btn-icon" title="刪除" onclick="deleteTask('${task.id}')">✕</button>
            </div>
          </div>
          ${adjustHtml}
        `;
        listEl.appendChild(item);
      });

      document.getElementById('taskCountBadge').textContent = `${runningCount} 個進行中`;
    }

    // ====== 主計時器每秒巡檢 ======
    setInterval(() => {
      if (waterRunning) {
        if (waterRemainingSec > 0) {
          waterRemainingSec--;
          updateWaterDisplay();
        } else {
          enqueueAlert('water');
          waterRemainingSec = state.waterInterval * 60;
        }
      }

      const now = Date.now();
      state.tasks.forEach(task => {
        if (task.status === 'running') {
          const diff = task.targetTimestamp - now;
          const cdEl = document.getElementById(`cd-${task.id}`);
          if (cdEl) {
            const scheduleDesc = task.mode === 'time' ? `目標 ${task.timeStr}` : `每 ${task.minutes} 分鐘`;
            cdEl.textContent = `${scheduleDesc} ・ ${formatRemaining(diff)}`;
          }
          if (diff <= 0) {
            enqueueAlert(task);
          }
        }
      });
    }, 1000);

    renderTasks();
  </script>
</body>
</html>
